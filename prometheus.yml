global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:

  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'node_exporter'
    static_configs:
      - targets: ['node_exporter:9100']

  - job_name: 'devops_helper'
    static_configs:
      - targets: ['host.docker.internal:5000']

  - job_name: 'expense_calculator'
    static_configs:
      - targets: ['host.docker.internal:7000']

  - job_name: 'chart_app'
    static_configs:
      - targets: ['host.docker.internal:8000']

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']

rule_files:
  - "alert.rules.yml"
